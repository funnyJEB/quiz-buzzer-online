<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>실시간 퀴즈 부저</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #fdfbf7;
      --card-bg: #ffffff;
      --text: #2d3748;
      --score-bg: #fef08a; /* 파스텔 옐로우 */
      --score-text: #854d0e;
      --buzzer-ready: linear-gradient(145deg, #ff6b6b, #ee5253);
      --buzzer-disabled: #cbd5e1;
      --border: #f1f5f9;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 18px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 94vh; box-sizing: border-box; }
    
    /* 헤더 카드 */
    .top-card { width: 100%; max-width: 380px; background: var(--card-bg); border-radius: 20px; padding: 16px 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.04); border: 1px solid #fed7aa; display: flex; justify-content: space-between; align-items: center; }
    .student-badge { font-size: 20px; font-weight: 900; color: #1e293b; background: #f1f5f9; padding: 6px 14px; border-radius: 12px; }
    .btn-leave { background: #fee2e2; color: #ef4444; border: none; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 8px; cursor: pointer; }
    
    /* 점수 강조 레이어 */
    .score-card { width: 100%; max-width: 380px; background: var(--score-bg); border-radius: 20px; padding: 16px; margin-top: 14px; text-align: center; box-shadow: 0 4px 15px rgba(254, 240, 138, 0.4); }
    .score-num { font-size: 56px; font-weight: 900; color: var(--score-text); line-height: 1; }
    .score-unit { font-size: 22px; font-weight: 800; color: var(--score-text); margin-left: 4px; }
    
    /* 부저 버튼 (입체 토이 팝 스타일) */
    .buzzer-wrap { margin: auto 0; text-align: center; }
    .buzzer-btn { width: 230px; height: 230px; border-radius: 50%; border: 8px solid #ffffff; font-size: 34px; font-weight: 900; color: white; cursor: pointer; outline: none; transition: transform 0.08s ease, box-shadow 0.08s ease; display: flex; align-items: center; justify-content: center; user-select: none; -webkit-tap-highlight-color: transparent; }
    .btn-ready { background: var(--buzzer-ready); box-shadow: 0 14px 28px rgba(238, 82, 83, 0.45); }
    .btn-ready:active { transform: scale(0.92); box-shadow: 0 4px 10px rgba(238, 82, 83, 0.3); }
    .btn-disabled { background: var(--buzzer-disabled); color: #94a3b8; cursor: not-allowed; box-shadow: none; border-color: #e2e8f0; }
    
    .status-text { font-size: 18px; font-weight: 800; color: #64748b; margin-top: 16px; min-height: 28px; }
    
    /* 로그인 모달 */
    .login-box { width: 100%; max-width: 360px; background: white; border-radius: 24px; padding: 32px 24px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.06); border: 1px solid #fed7aa; margin: auto 0; }
    input[type="text"] { width: 85%; padding: 15px; font-size: 18px; font-weight: 700; border-radius: 12px; border: 2px solid #e2e8f0; text-align: center; margin: 18px 0; outline: none; transition: border-color 0.2s; }
    input[type="text"]:focus { border-color: #fb923c; }
    .start-btn { width: 93%; padding: 15px; font-size: 18px; font-weight: 800; border-radius: 12px; border: none; background: #fb923c; color: white; cursor: pointer; box-shadow: 0 6px 15px rgba(251, 146, 60, 0.4); }
  </style>
</head>
<body>

  <!-- 1. 입장 화면 -->
  <div id="loginView" class="login-box">
    <div style="font-size: 40px; margin-bottom: 10px;">👋</div>
    <h2 style="margin: 0; color: #1e293b;">퀴즈 참가하기</h2>
    <p style="color: #64748b; font-size: 14px; margin-top: 6px;">사용할 닉네임을 입력하세요</p>
    <input type="text" id="nicknameInput" placeholder="닉네임 입력" maxlength="12">
    <button class="start-btn" onclick="startQuiz()">입장하기</button>
  </div>

  <!-- 2. 부저 게임 화면 -->
  <div id="quizView" style="display: none; width: 100%; max-width: 380px; flex-direction: column; align-items: center;">
    <div class="top-card">
      <span id="studentNameDisplay" class="student-badge">김철수</span>
      <button class="btn-leave" onclick="leaveQuiz()">아이디 변경 / 나가기</button>
    </div>

    <!-- 점수 레이어 -->
    <div class="score-card">
      <span id="scoreVal" class="score-num">0</span><span class="score-unit">점</span>
    </div>

    <div class="buzzer-wrap">
      <button id="buzzerBtn" class="buzzer-btn btn-disabled" disabled onclick="handleBuzzerPress()">부저</button>
      <div id="statusMsg" class="status-text">선생님이 부저를 열 때까지 대기하세요</div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentName = '';
    let isBuzzerOpen = false;
    let hasPressed = false;

    // 세션 스토리지에서 이전 닉네임 자동 복원 (새로고침 대응)
    window.addEventListener('load', () => {
      const savedName = sessionStorage.getItem('quiz_nickname');
      if (savedName) {
        joinRoom(savedName);
      }
    });

    function startQuiz() {
      const input = document.getElementById('nicknameInput');
      const name = input.value.trim();
      if (!name) return alert('닉네임을 입력해주세요!');
      joinRoom(name);
    }

    function joinRoom(name) {
      currentName = name;
      sessionStorage.setItem('quiz_nickname', name);
      socket.emit('register_student', name);

      document.getElementById('studentNameDisplay').innerText = name;
      document.getElementById('loginView').style.display = 'none';
      document.getElementById('quizView').style.display = 'flex';
    }

    function leaveQuiz() {
      if (confirm('아이디를 변경하거나 퇴장하시겠습니까?')) {
        sessionStorage.removeItem('quiz_nickname');
        location.reload();
      }
    }

    function handleBuzzerPress() {
      if (!isBuzzerOpen || hasPressed) return;
      hasPressed = true;
      socket.emit('press_buzzer');
      updateUI(false, '신호 전송 완료!');
    }

    socket.on('score_update', (score) => {
      document.getElementById('scoreVal').innerText = score;
    });

    socket.on('buzzer_state_change', ({ isLocked }) => {
      isBuzzerOpen = !isLocked;
      if (isBuzzerOpen) {
        hasPressed = false;
        updateUI(true, '지금 부저를 누르세요!');
      } else {
        updateUI(false, '부저가 닫혔습니다');
      }
    });

    socket.on('buzzer_reset', () => {
      hasPressed = false;
      isBuzzerOpen = true;
      updateUI(true, '지금 부저를 누르세요!');
    });

    socket.on('buzzer_result', ({ rank, isFirst }) => {
      const msg = document.getElementById('statusMsg');
      if (isFirst) {
        msg.innerText = '🎉 1순위 정답 기회 획득!';
        msg.style.color = '#ef4444';
        if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
      } else {
        msg.innerText = `선착순 ${rank}위 등록되었습니다`;
        msg.style.color = '#f59e0b';
        if (navigator.vibrate) navigator.vibrate(80);
      }
    });

    socket.on('force_kicked', () => {
      alert('선생님에 의해 퇴장되었습니다.');
      sessionStorage.removeItem('quiz_nickname');
      location.reload();
    });

    function updateUI(active, text) {
      const btn = document.getElementById('buzzerBtn');
      const msg = document.getElementById('statusMsg');
      msg.innerText = text;
      if (active) {
        btn.disabled = false;
        btn.className = 'buzzer-btn btn-ready';
      } else {
        btn.disabled = true;
        btn.className = 'buzzer-btn btn-disabled';
      }
    }
  </script>
</body>
</html>
