<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>퀴즈 부저</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --score-bg: #fef9c3; /* 부드러운 레몬 파스텔 */
      --score-text: #854d0e;
      --buzzer-ready: radial-gradient(circle at 35% 35%, #ff5252, #d32f2f);
      --buzzer-disabled: #e2e8f0;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      height: 100dvh; /* 모바일 주소창 대응 세로 꽉 찬 높이 */
      box-sizing: border-box;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. 상단 사용자 명찰 카드 */
    .top-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 12px 16px;
      border-radius: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      border: 1px solid var(--border);
      box-sizing: border-box;
    }
    .student-badge {
      font-size: 18px;
      font-weight: 800;
      color: #0f172a;
    }
    .btn-leave {
      background: #fee2e2;
      color: #dc2626;
      border: none;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* 연결 상태 안내 */
    .notice {
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      display: none;
    }
    .notice.show { display: block; }
    .notice-conn { background: #fee2e2; color: #b91c1c; }
    .notice-sound { background: #e0e7ff; color: #3730a3; }

    /* 2. 점수 전용 레이어 */
    .score-card {
      width: 100%;
      max-width: 360px;
      background: var(--score-bg);
      border-radius: 18px;
      padding: 12px 0;
      margin-top: 10px;
      text-align: center;
      box-shadow: 0 4px 12px rgba(254, 240, 138, 0.45);
      border: 1px solid #fef08a;
    }
    .score-num {
      font-size: 46px;
      font-weight: 900;
      color: var(--score-text);
      line-height: 1;
    }
    .score-unit {
      font-size: 18px;
      font-weight: 700;
      color: var(--score-text);
      margin-left: 2px;
    }

    /* 3. 중앙 부저 버튼 영역 */
    .buzzer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      width: 100%;
      margin: 10px 0;
    }
    .buzzer-btn {
      width: min(65vw, 230px);
      height: min(65vw, 230px);
      border-radius: 50%;
      border: 8px solid #ffffff;
      font-size: 34px;
      font-weight: 900;
      color: white;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;   /* 길게 눌러도 메뉴가 뜨지 않게 */
      touch-action: manipulation;    /* 확대 대기시간 없이 바로 반응 */
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.06s ease, box-shadow 0.06s ease;
    }
    .btn-ready {
      background: var(--buzzer-ready);
      box-shadow: 0 12px 24px rgba(220, 38, 38, 0.4);
    }
    .btn-ready:active {
      transform: scale(0.93);
      box-shadow: 0 4px 10px rgba(220, 38, 38, 0.3);
    }
    .btn-disabled {
      background: var(--buzzer-disabled);
      color: #94a3b8;
      cursor: not-allowed;
      box-shadow: none;
      border-color: #cbd5e1;
    }

    /* 4. 하단 상태 메시지 (가독성 높은 폰트) */
    .status-msg {
      font-size: 17px;
      font-weight: 700;
      color: #64748b;
      margin-top: 18px;
      min-height: 26px;
      text-align: center;
      letter-spacing: -0.3px;
    }

    /* 입장 화면 */
    .login-box {
      width: 100%;
      max-width: 340px;
      background: white;
      border-radius: 20px;
      padding: 32px 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
      border: 1px solid var(--border);
      margin: auto 0;
      box-sizing: border-box;
    }
    input[type="text"] {
      width: 82%;
      padding: 14px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      text-align: center;
      margin: 18px 0 8px;
      outline: none;
    }
    input[type="text"]:focus { border-color: #4f46e5; }
    .login-msg {
      min-height: 20px;
      font-size: 13px;
      font-weight: 700;
      color: #dc2626;
      margin-bottom: 10px;
    }
    .start-btn {
      width: 90%;
      padding: 14px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 12px;
      border: none;
      background: #4f46e5;
      color: white;
      cursor: pointer;
    }
    .start-btn:disabled { opacity: 0.6; }
  </style>
</head>
<body>

  <!-- 1. 로그인 창 -->
  <div id="loginView" class="login-box">
    <div style="font-size: 38px; margin-bottom: 8px;">🔔</div>
    <h2 style="margin: 0; font-size: 22px;">퀴즈 참가하기</h2>
    <p style="color: #64748b; font-size: 14px; margin-top: 6px;">사용할 닉네임을 입력해주세요</p>
    <input type="text" id="nicknameInput" placeholder="닉네임" maxlength="12" autocomplete="off">
    <div id="loginMsg" class="login-msg"></div>
    <button id="startBtn" class="start-btn" onclick="startQuiz()">입장하기</button>
  </div>

  <!-- 2. 부저 메인 창 (스마트폰 세로 최적화) -->
  <div id="quizView" style="display: none; width: 100%; max-width: 360px; height: 100%; flex-direction: column; align-items: center; justify-content: space-between;">
    <div class="top-bar">
      <span id="studentNameDisplay" class="student-badge">-</span>
      <button class="btn-leave" onclick="leaveQuiz()">닉네임 변경</button>
    </div>

    <div id="connNotice" class="notice notice-conn">연결이 끊겼어요. 다시 연결하는 중...</div>
    <div id="soundNotice" class="notice notice-sound">🔇 화면을 한 번 터치하면 알림음이 켜져요</div>

    <div class="score-card">
      <span id="scoreVal" class="score-num">0</span><span class="score-unit">점</span>
    </div>

    <div class="buzzer-container">
      <button id="buzzerBtn" class="buzzer-btn btn-disabled" disabled>부저</button>
      <div id="statusMsg" class="status-msg">선생님이 부저를 열 때까지 기다리세요</div>
    </div>
  </div>

  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);

    let currentName = '';   // 입장이 완료된 닉네임
    let isOpen = false;     // 부저가 열려 있는지
    let hasPressed = false; // 이번 문제에서 눌렀는지
    let myRank = null;
    let joining = false;
    let blocked = false;    // 다른 창 접속으로 끊긴 상태

    // ---------- 저장소 (막혀 있어도 동작하도록) ----------
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
      remove(k) { try { localStorage.removeItem(k); } catch (e) {} }
    };

    // 기기 고유 번호: 같은 브라우저의 모든 탭이 공유 → 기기당 접속 하나
    const deviceId = (() => {
      let id = store.get('quiz_device_id');
      if (!id || !/^[A-Za-z0-9_-]{8,64}$/.test(id)) {
        id = (window.crypto && crypto.randomUUID)
          ? crypto.randomUUID()
          : Date.now().toString(36) + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
        id = id.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 64);
        store.set('quiz_device_id', id);
      }
      return id;
    })();

    // ---------- 소리 (Web Audio, 지연 없는 합성음) ----------
    // 휴대폰 브라우저는 사용자가 화면을 터치해야 소리를 켤 수 있어서, 첫 터치 때 오디오를 켭니다.
    let audioCtx = null;
    function unlockAudio() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
          audioCtx.addEventListener('statechange', updateSoundNotice);
        }
        if (audioCtx.state !== 'running') audioCtx.resume().then(updateSoundNotice).catch(() => {});
      } catch (e) {}
      updateSoundNotice();
    }
    ['pointerup', 'touchend', 'click', 'keydown'].forEach(ev =>
      document.addEventListener(ev, unlockAudio, { passive: true })
    );
    function soundReady() { return audioCtx && audioCtx.state === 'running'; }
    function updateSoundNotice() {
      $('soundNotice').classList.toggle('show', !!currentName && !soundReady());
    }

    function playBuzzerSound() {
      if (!soundReady()) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, t);
      osc.frequency.exponentialRampToValueAtTime(150, t + 0.18);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.18);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.18);
    }

    function playOpenSound() {
      if (!soundReady()) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(523.25, t);        // C5
      osc.frequency.setValueAtTime(659.25, t + 0.08); // E5
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 0.2);
    }

    // ---------- 입장 ----------
    function showLogin(message) {
      currentName = '';
      isOpen = false; hasPressed = false; myRank = null;
      $('quizView').style.display = 'none';
      $('loginView').style.display = '';
      $('loginMsg').textContent = message || '';
      $('startBtn').disabled = false;
      updateSoundNotice();
    }

    function showQuiz() {
      $('loginView').style.display = 'none';
      $('quizView').style.display = 'flex';
      updateSoundNotice();
    }

    function startQuiz() {
      unlockAudio();
      const name = $('nicknameInput').value.trim();
      if (!name) { $('loginMsg').textContent = '닉네임을 입력해주세요!'; return; }
      joinRoom(name, false);
    }
    $('nicknameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') startQuiz(); });

    function joinRoom(name, isAuto) {
      if (joining) return;
      joining = true;
      $('startBtn').disabled = true;
      if (!socket.connected) socket.connect();
      socket.emit('register_student', { name, deviceId }, (res) => {
        joining = false;
        $('startBtn').disabled = false;
        if (!res || !res.ok) {
          store.remove('quiz_nickname');
          if (isAuto) $('nicknameInput').value = name;
          showLogin((res && res.error) || '입장하지 못했어요. 다시 시도해 주세요.');
          return;
        }
        currentName = res.name;
        store.set('quiz_nickname', res.name);
        $('studentNameDisplay').textContent = res.name;
        $('scoreVal').textContent = res.score;
        isOpen = !res.isLocked;
        hasPressed = !!res.hasBuzzed;
        myRank = res.rank || null;
        render();
        showQuiz();
      });
    }

    function leaveQuiz() {
      if (confirm('닉네임을 변경하시겠습니까? (점수는 그대로 이어집니다)')) {
        store.remove('quiz_nickname');
        $('nicknameInput').value = currentName;
        showLogin('');
      }
    }

    // 연결될 때마다(처음 접속, 화면 꺼졌다 켜짐, 와이파이 재연결) 자동으로 다시 등록
    socket.on('connect', () => {
      $('connNotice').classList.remove('show');
      if (blocked) return;
      const name = currentName || store.get('quiz_nickname');
      if (name) joinRoom(name, true);
    });

    socket.on('disconnect', () => {
      if (!currentName) return;
      isOpen = false;
      render();
      $('connNotice').classList.add('show');
    });

    // ---------- 부저 ----------
    // 손가락이 화면에 닿는 순간(pointerdown) 바로 전송
    $('buzzerBtn').addEventListener('pointerdown', handleBuzzerPress);
    $('buzzerBtn').addEventListener('contextmenu', (e) => e.preventDefault());

    function handleBuzzerPress() {
      if (!isOpen || hasPressed || !currentName) return;
      hasPressed = true;
      playBuzzerSound();
      setUI(false, '신호 전송 중...', '#64748b');
      socket.timeout(5000).emit('press_buzzer', (err, res) => {
        if (err) {
          hasPressed = false;
          render();
          $('statusMsg').textContent = '전송 실패! 다시 눌러주세요';
          return;
        }
        if (res && res.ok) {
          myRank = res.rank;
          if (navigator.vibrate) navigator.vibrate(myRank === 1 ? [100, 50, 100] : 80);
        } else if (res && res.locked) {
          isOpen = false;
          hasPressed = false;
        } else {
          hasPressed = false;
        }
        render();
      });
    }

    socket.on('buzzer_state_change', ({ isLocked, fresh }) => {
      if (!currentName) return;
      if (!isLocked && fresh) {
        hasPressed = false;
        myRank = null;
        playOpenSound();
      }
      isOpen = !isLocked;
      render();
    });

    socket.on('score_update', (score) => {
      $('scoreVal').textContent = score;
    });

    socket.on('force_kicked', () => {
      store.remove('quiz_nickname');
      showLogin('선생님이 퇴장 처리했어요. 다시 입장하려면 닉네임을 입력하세요.');
    });

    socket.on('force_game_restart', () => {
      store.remove('quiz_nickname');
      $('scoreVal').textContent = 0;
      showLogin('새 게임이 시작되었어요. 닉네임을 다시 입력해 주세요.');
    });

    // 같은 기기에서 다른 창(탭)으로 접속한 경우
    socket.on('duplicate_session', () => {
      blocked = true;
      currentName = '';
      $('quizView').style.display = 'none';
      $('loginView').style.display = '';
      $('loginView').innerHTML =
        '<div style="font-size:38px;margin-bottom:8px;">📵</div>' +
        '<h2 style="margin:0;font-size:20px;">다른 창에서 접속했어요</h2>' +
        '<p style="color:#64748b;font-size:14px;line-height:1.5;">같은 기기에서는 한 창만 사용할 수 있어요.<br>이 창은 닫아 주세요.</p>' +
        '<button class="start-btn" onclick="location.reload()">이 창에서 다시 접속하기</button>';
    });

    // ---------- 화면 표시 ----------
    function render() {
      if (hasPressed && myRank) {
        if (myRank === 1) setUI(false, '🎉 1순위 정답 기회 획득!', '#dc2626');
        else setUI(false, `선착순 ${myRank}위 접수 완료!`, '#f59e0b');
      } else if (hasPressed) {
        setUI(false, '신호 전송 중...', '#64748b');
      } else if (isOpen) {
        setUI(true, '지금 부저를 누르세요!', '#64748b');
      } else {
        setUI(false, '선생님이 부저를 열 때까지 기다리세요', '#64748b');
      }
    }

    function setUI(active, text, color) {
      const btn = $('buzzerBtn');
      const msg = $('statusMsg');
      msg.textContent = text;
      msg.style.color = color || '#64748b';
      btn.disabled = !active;
      btn.className = active ? 'buzzer-btn btn-ready' : 'buzzer-btn btn-disabled';
    }
  </script>
</body>
</html>
