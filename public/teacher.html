<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>퀴즈 현황판</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1050px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header-left { display: flex; align-items: center; gap: 14px; }
    h1 { font-size: 24px; font-weight: 700; color: #1e293b; margin: 0; letter-spacing: -0.5px; }

    /* 접속 QR 버튼 */
    .btn-qr {
      background: #e0e7ff;
      color: var(--primary);
      border: 1px solid #c7d2fe;
      padding: 6px 14px;
      font-size: 14px;
      font-weight: 700;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s ease;
    }
    .btn-qr:hover { background: #c7d2fe; }

    .status-pill { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .pill-open { background: var(--success-soft); color: #15803d; border: 1px solid #bbf7d0; }
    .pill-locked { background: var(--danger-soft); color: #b91c1c; border: 1px solid #fecaca; }

    .toolbar {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-light { background: #f1f5f9; color: #334155; border: 1px solid var(--border); }
    select { font-family: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; color: #334155; }

    .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
    .card-title { font-size: 17px; font-weight: 700; color: #1e293b; margin: 0 0 16px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    /* 1순위 상단 박스 */
    .turn-box { background: var(--primary-soft); border: 1.5px solid #c7d2fe; border-radius: 12px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; gap: 12px; }
    .turn-box.done { background: var(--success-soft); border-color: #bbf7d0; }
    .turn-label { font-size: 12px; font-weight: 700; color: #4338ca; }
    .turn-box.done .turn-label { color: #15803d; }
    .turn-name { font-size: 22px; font-weight: 800; color: #312e81; }
    .turn-box.done .turn-name { color: #14532d; }
    .turn-actions { display: flex; gap: 8px; }
    .turn-result { font-size: 20px; font-weight: 800; color: var(--success); }

    /* 순위 리스트 */
    .queue-list { list-style: none; padding: 0; margin: 0; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 8px; margin-bottom: 6px; background: #f8fafc; border: 1px solid var(--border); }
    .rank-num { font-weight: 700; width: 34px; color: var(--primary); font-size: 15px; }
    .q-name { font-size: 16px; font-weight: 700; color: #1e293b; }
    .q-time { text-align: right; line-height: 1.25; }
    .q-elapsed { font-size: 15px; font-weight: 700; color: #334155; font-variant-numeric: tabular-nums; }
    .q-gap { font-size: 12px; font-weight: 600; color: #94a3b8; font-variant-numeric: tabular-nums; }
    .empty { color: #94a3b8; text-align: center; padding: 20px; }

    /* 점수 현황 카드 리스트 */
    .score-list { list-style: none; padding: 0; margin: 0; max-height: 480px; overflow-y: auto; }
    .score-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; position: relative; }
    .student-name { font-size: 17px; font-weight: 700; color: #1e293b; }
    .student-name.offline { color: #94a3b8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: #cbd5e1; flex-shrink: 0; }
    .dot.on { background: #22c55e; }
    .student-score { font-size: 19px; font-weight: 800; color: var(--primary); margin-right: 12px; }
    .btn-gear { background: transparent; border: none; font-size: 16px; cursor: pointer; padding: 4px; border-radius: 6px; }
    .btn-gear:hover { background: #e2e8f0; }

    /* 점수 톱니바퀴 팝오버 메뉴 */
    .action-menu { display: none; position: absolute; right: 10px; top: 40px; background: white; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 8px; z-index: 50; flex-direction: column; gap: 6px; }
    .action-menu.active { display: flex; }
    .action-menu button { font-size: 12px; padding: 6px 10px; justify-content: center; }

    /* 모달 공통 (QR, PIN) */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.open { display: flex; }
    .modal-box {
      background: white;
      border-radius: 24px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      max-width: 420px;
      width: 90%;
      box-sizing: border-box;
      animation: popIn 0.2s ease-out;
    }
    @keyframes popIn {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .qr-img {
      width: 300px;
      height: 300px;
      max-width: 100%;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      margin: 16px 0;
      display: inline-block;
      background: white;
    }
    .qr-url-text {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
      word-break: break-all;
      background: #f1f5f9;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 18px;
    }

    /* PIN 화면: 인증 전에는 현황판을 가림 */
    #pinGate { background: #f1f5f9; backdrop-filter: none; }
    #pinInput {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      text-align: center;
      border-radius: 12px;
      border: 1.5px solid #cbd5e1;
      margin: 18px 0 8px;
      outline: none;
    }
    #pinInput:focus { border-color: var(--primary); }
    .pin-msg { min-height: 20px; font-size: 13px; font-weight: 700; color: var(--danger); margin-bottom: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="header-left">
        <h1>📊 퀴즈 현황판</h1>
        <button class="btn-qr" onclick="openQrModal()">📱 접속 QR</button>
      </div>
      <div>
        <span style="font-size: 14px; color: var(--text-sub); margin-right: 12px;">접속 학생: <strong id="onlineCount" style="color: var(--primary);">0</strong>명</span>
        <span id="lockBadge" class="status-pill pill-locked">부저 잠김</span>
      </div>
    </header>

    <div class="toolbar">
      <label style="font-size: 14px; font-weight: 600;">배점:
        <select id="scoreSelect" onchange="changeScore(this.value)">
          <option value="5">5점</option>
          <option value="10" selected>10점</option>
          <option value="20">20점</option>
          <option value="30">30점</option>
          <option value="50">50점</option>
        </select>
      </label>

      <button class="btn-primary" onclick="openBuzzer()">🔔 새 문제 (부저 열기)</button>
      <button class="btn-danger" onclick="lockBuzzer()">🛑 부저 잠금</button>

      <label style="margin-left: auto; font-size: 14px; font-weight: 600;">선착순 마감 인원:
        <select id="cutoffSelect" onchange="changeCutoff(this.value)">
          <option value="3">3명에서 마감</option>
          <option value="5">5명에서 마감</option>
          <option value="10" selected>10명에서 마감</option>
          <option value="15">15명에서 마감</option>
          <option value="30">30명에서 마감</option>
        </select>
      </label>

      <button class="btn-light" onclick="resetAllScores()">🔄 점수 리셋</button>
      <button class="btn-danger" style="background: #e11d48;" onclick="startNewGame()">🚨 새 게임 시작</button>
    </div>

    <div class="grid">
      <!-- 선착순 큐 영역 -->
      <div class="card">
        <div class="card-title">
          <span>⚡ 누가 먼저 눌렀을까요? (<span id="queueLen">0</span>명 접수)</span>
        </div>

        <div id="firstBox" class="turn-box" style="display: none;">
          <div>
            <div id="firstLabel" class="turn-label">🏆 1순위 정답 기회</div>
            <div id="firstName" class="turn-name">-</div>
          </div>
          <div id="turnActions" class="turn-actions">
            <button id="btnCorrect" class="btn-primary" style="background: var(--success);" onclick="judge(true)">정답 (+10점)</button>
            <button class="btn-danger" onclick="judge(false)">오답 (다음 순위로)</button>
          </div>
          <div id="turnResult" class="turn-result" style="display: none;"></div>
        </div>

        <ul id="queueList" class="queue-list">
          <li class="empty">문제를 시작하면 선착순 명단이 여기에 표시됩니다.</li>
        </ul>
      </div>

      <!-- 점수 현황 영역 -->
      <div class="card">
        <div class="card-title">
          <span>🏆 점수 현황</span>
        </div>
        <ul id="scoreList" class="score-list"></ul>
      </div>
    </div>
  </div>

  <!-- 학생 접속 QR코드 팝업 -->
  <div id="qrModal" class="modal" onclick="closeQrModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <h2 style="margin: 0; font-size: 22px; color: #1e293b;">스마트폰으로 카메라를 비춰주세요</h2>
      <p style="color: #64748b; font-size: 14px; margin: 6px 0 0 0;">QR코드를 스캔하면 부저 화면으로 바로 연결됩니다.</p>
      <img id="qrImage" class="qr-img" alt="학생 접속용 QR코드" src="" />
      <div id="qrUrlDisplay" class="qr-url-text">-</div>
      <button class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 16px;" onclick="closeQrModal()">화면 닫기</button>
    </div>
  </div>

  <!-- 교사 PIN 인증 -->
  <div id="pinGate" class="modal open">
    <div class="modal-box">
      <div style="font-size: 36px;">🔒</div>
      <h2 style="margin: 8px 0 0; font-size: 22px; color: #1e293b;">교사 인증</h2>
      <p style="color: #64748b; font-size: 14px; margin: 6px 0 0;">교사용 PIN을 입력하세요.</p>
      <input id="pinInput" type="password" autocomplete="off" placeholder="PIN">
      <div id="pinMsg" class="pin-msg"></div>
      <button id="pinBtn" class="btn-primary" style="width: 100%; justify-content: center; padding: 12px; font-size: 16px;" onclick="submitPin()">확인</button>
    </div>
  </div>

  <script>
    const socket = io();
    const $ = (id) => document.getElementById(id);
    let state = { isLocked: true, queue: [], scores: {}, online: [], cutoffCount: 10, lastScore: 10, answered: null };
    let firstState = true;

    // ---------- 교사 PIN 인증 ----------
    // PIN은 이 탭에만 기억(sessionStorage) → 새로고침해도 다시 묻지 않고, 창을 닫으면 사라짐
    function getSavedPin() { try { return sessionStorage.getItem('teacher_pin') || ''; } catch (e) { return ''; } }
    function savePin(pin) {
      try { pin ? sessionStorage.setItem('teacher_pin', pin) : sessionStorage.removeItem('teacher_pin'); } catch (e) {}
    }
    const PIN_ERRORS = {
      wrong: 'PIN이 올바르지 않습니다.',
      too_many: '시도 횟수를 초과했습니다. 새로고침 후 다시 시도하세요.',
      not_configured: '서버에 교사 PIN이 설정되지 않았습니다.<br>Render 대시보드 → Environment에서 TEACHER_PIN을 추가해 주세요.'
    };

    function login(pin, silent) {
      $('pinBtn').disabled = true;
      socket.emit('teacher_login', pin, (res) => {
        $('pinBtn').disabled = false;
        if (res && res.ok) {
          savePin(pin);
          $('pinGate').classList.remove('open');
          $('pinMsg').textContent = '';
          $('pinInput').value = '';
          return;
        }
        savePin('');
        $('pinGate').classList.add('open');
        const err = res && res.error;
        if (!silent || err === 'not_configured') $('pinMsg').innerHTML = PIN_ERRORS[err] || '인증에 실패했습니다.';
        $('pinInput').focus();
      });
    }
    function submitPin() {
      const pin = $('pinInput').value.trim();
      if (!pin) { $('pinMsg').textContent = 'PIN을 입력하세요.'; return; }
      login(pin, false);
    }
    $('pinInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') submitPin(); });
    $('pinInput').focus();

    // 연결될 때마다(처음, 서버 재시작, 네트워크 재연결) 저장된 PIN으로 자동 재인증
    socket.on('connect', () => {
      const pin = getSavedPin();
      if (pin) login(pin, true);
    });
    socket.on('disconnect', (reason) => {
      if (reason === 'io server disconnect') {
        $('pinGate').classList.add('open');
        $('pinMsg').innerHTML = PIN_ERRORS.too_many;
      }
    });

    // ---------- QR코드 ----------
    function openQrModal() {
      $('qrUrlDisplay').textContent = window.location.origin + '/';
      $('qrImage').src = '/qr.svg';
      $('qrModal').classList.add('open');
    }
    function closeQrModal() {
      $('qrModal').classList.remove('open');
    }

    // ---------- 서버 상태 반영 ----------
    socket.on('teacher_state', (data) => {
      state = data;
      if (firstState) {
        // 새로고침 직후 한 번만 서버에 저장된 선택값으로 복원
        $('scoreSelect').value = String(data.lastScore);
        $('cutoffSelect').value = String(data.cutoffCount);
        firstState = false;
      }
      updateCorrectLabel();
      updateLockStatus(data.isLocked);
      $('onlineCount').textContent = data.online.length;
      renderQueue();
      renderScores();
    });

    function updateLockStatus(isLocked) {
      const badge = $('lockBadge');
      if (isLocked) {
        badge.textContent = '부저 잠김';
        badge.className = 'status-pill pill-locked';
      } else {
        badge.textContent = '부저 열림 (신호 대기중)';
        badge.className = 'status-pill pill-open';
      }
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text; // 이름은 항상 글자로만 표시 (HTML로 해석하지 않음)
      return node;
    }
    function sec(ms) { return (ms / 1000).toFixed(2) + '초'; }

    function renderQueue() {
      const queue = state.queue;
      const answered = state.answered;
      $('queueLen').textContent = queue.length;

      const firstBox = $('firstBox');
      if (answered) {
        firstBox.style.display = 'flex';
        firstBox.classList.add('done');
        $('firstLabel').textContent = '✅ 정답 처리 완료';
        $('firstName').textContent = answered.name;
        $('turnActions').style.display = 'none';
        $('turnResult').style.display = '';
        $('turnResult').textContent = `+${answered.point}점`;
      } else if (queue.length > 0) {
        firstBox.style.display = 'flex';
        firstBox.classList.remove('done');
        $('firstLabel').textContent = '🏆 1순위 정답 기회';
        $('firstName').textContent = queue[0].name;
        $('turnActions').style.display = '';
        $('turnResult').style.display = 'none';
      } else {
        firstBox.style.display = 'none';
      }

      const list = $('queueList');
      list.innerHTML = '';
      if (queue.length === 0) {
        list.appendChild(el('li', 'empty', '문제를 시작하면 선착순 명단이 여기에 표시됩니다.'));
        return;
      }

      const base = queue[0].elapsed;
      queue.forEach((item, idx) => {
        const li = el('li', 'queue-item');

        const left = el('div');
        left.style.cssText = 'display:flex; align-items:center;';
        left.appendChild(el('span', 'rank-num', `${idx + 1}위`));
        const nameEl = el('span', 'q-name', item.name);
        if (idx === 0) nameEl.style.color = 'var(--primary)';
        left.appendChild(nameEl);

        const right = el('div', 'q-time');
        right.appendChild(el('div', 'q-elapsed', `열린 후 ${sec(item.elapsed)}`));
        right.appendChild(el('div', 'q-gap', idx === 0 ? '기준' : `1등과 +${sec(item.elapsed - base)}`));

        li.appendChild(left);
        li.appendChild(right);
        list.appendChild(li);
      });
    }

    function renderScores() {
      const list = $('scoreList');
      list.innerHTML = '';
      const online = new Set(state.online);
      const sorted = Object.entries(state.scores).sort((a, b) => b[1] - a[1]);

      if (sorted.length === 0) {
        list.appendChild(el('li', 'empty', '접속한 학생이 없습니다.'));
        return;
      }

      sorted.forEach(([name, score], idx) => {
        const isOn = online.has(name);
        const li = el('li', 'score-item');

        const left = el('div');
        left.style.cssText = 'display:flex; align-items:center; gap: 8px;';
        const rank = el('span', '', String(idx + 1));
        rank.style.cssText = 'font-size: 13px; font-weight: 700; color: #94a3b8; width: 20px;';
        const dot = el('span', isOn ? 'dot on' : 'dot');
        dot.title = isOn ? '접속 중' : '연결 끊김';
        left.append(rank, dot, el('span', isOn ? 'student-name' : 'student-name offline', name));

        const right = el('div');
        right.style.cssText = 'display:flex; align-items:center;';
        const gear = el('button', 'btn-gear', '⚙️');
        const menu = el('div', 'action-menu');
        const plus = el('button', 'btn-light', '+10점');
        const minus = el('button', 'btn-light', '-5점');
        const kick = el('button', 'btn-danger', '퇴장');
        kick.style.cssText = 'background:#fee2e2; color:#dc2626;';
        plus.onclick = () => adjustScore(name, 10);
        minus.onclick = () => adjustScore(name, -5);
        kick.onclick = () => kickStudent(name);
        gear.onclick = (e) => {
          e.stopPropagation();
          const wasOpen = menu.classList.contains('active');
          closeMenus();
          if (!wasOpen) menu.classList.add('active');
        };
        menu.append(plus, minus, kick);
        right.append(el('span', 'student-score', `${score}점`), gear, menu);

        li.append(left, right);
        list.appendChild(li);
      });
    }

    function closeMenus() {
      document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
    }
    document.addEventListener('click', closeMenus);

    // ---------- 교사 조작 ----------
    function updateCorrectLabel() {
      $('btnCorrect').textContent = `정답 (+${$('scoreSelect').value}점)`;
    }
    function changeScore(val) {
      updateCorrectLabel();
      socket.emit('set_score', val);
    }
    function openBuzzer() { socket.emit('open_buzzer'); }
    function lockBuzzer() { socket.emit('lock_buzzer'); }
    function changeCutoff(val) { socket.emit('set_cutoff', val); }
    function judge(isCorrect) {
      if (!state.queue.length) return;
      // 클릭하는 순간 선택돼 있는 배점 + 화면에 보이는 1순위 이름을 함께 보냄
      socket.emit('judge_first_student', {
        isCorrect,
        score: $('scoreSelect').value,
        name: state.queue[0].name
      });
    }
    function adjustScore(name, delta) { socket.emit('manual_score_adjust', { name, delta }); }
    function kickStudent(name) {
      if (confirm(`'${name}' 학생을 정말 퇴장시키겠습니까?`)) socket.emit('kick_student', name);
    }
    function resetAllScores() {
      if (confirm('모든 학생의 점수를 0점으로 초기화하시겠습니까? (학생 화면 유지)')) socket.emit('reset_all_scores');
    }
    function startNewGame() {
      if (confirm('새 게임을 시작하시겠습니까?\n모든 학생이 퇴장 처리되며 초기 로그인 화면으로 돌아갑니다.')) socket.emit('start_new_game');
    }
  </script>
</body>
</html>
