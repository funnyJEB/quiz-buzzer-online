<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>퀴즈 현황판</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #475569;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --success: #16a34a;
      --success-soft: #dcfce7;
      --danger: #dc2626;
      --danger-soft: #fee2e2;
      --border: #e2e8f0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1050px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 24px; font-weight: 700; color: #1e293b; margin: 0; letter-spacing: -0.5px; }
    .status-pill { padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; }
    .pill-open { background: var(--success-soft); color: #15803d; border: 1px solid #bbf7d0; }
    .pill-locked { background: var(--danger-soft); color: #b91c1c; border: 1px solid #fecaca; }

    .toolbar {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 16px 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      border: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
    }
    button {
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      padding: 9px 16px;
      border: none;
      border-radius: 8px;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    button:active { transform: scale(0.98); }
    .btn-primary { background: var(--primary); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-light { background: #f1f5f9; color: #334155; border: 1px solid var(--border); }
    select { font-family: inherit; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: #f8fafc; color: #334155; }

    .grid { display: grid; grid-template-columns: 1.3fr 1fr; gap: 20px; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); border: 1px solid var(--border); }
    .card-title { font-size: 17px; font-weight: 700; color: #1e293b; margin: 0 0 16px 0; padding-bottom: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }

    /* 1순위 상단 박스 */
    .turn-box { background: var(--primary-soft); border: 1.5px solid #c7d2fe; border-radius: 12px; padding: 16px 18px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .turn-name { font-size: 22px; font-weight: 800; color: #312e81; }
    .turn-actions { display: flex; gap: 8px; }

    /* 순위 리스트 */
    .queue-list { list-style: none; padding: 0; margin: 0; }
    .queue-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-radius: 8px; margin-bottom: 6px; background: #f8fafc; border: 1px solid var(--border); }
    .rank-num { font-weight: 700; width: 34px; color: var(--primary); font-size: 15px; }

    /* 점수 현황 카드 리스트 */
    .score-list { list-style: none; padding: 0; margin: 0; max-height: 480px; overflow-y: auto; }
    .score-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-bottom: 1px solid #f1f5f9; position: relative; }
    .student-name { font-size: 17px; font-weight: 700; color: #1e293b; }
    .student-score { font-size: 19px; font-weight: 800; color: var(--primary); margin-right: 12px; }
    .btn-gear { background: transparent; border: none; font-size: 16px; cursor: pointer; padding: 4px; border-radius: 6px; }
    .btn-gear:hover { background: #e2e8f0; }

    /* 점수 톱니바퀴 팝오버 메뉴 */
    .action-menu { display: none; position: absolute; right: 10px; top: 40px; background: white; border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); padding: 8px; z-index: 50; flex-direction: column; gap: 6px; }
    .action-menu.active { display: flex; }
    .action-menu button { font-size: 12px; padding: 6px 10px; justify-content: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 퀴즈 현황판</h1>
      <div>
        <span style="font-size: 14px; color: var(--text-sub); margin-right: 12px;">접속 학생: <strong id="onlineCount" style="color: var(--primary);">0</strong>명</span>
        <span id="lockBadge" class="status-pill pill-locked">부저 잠김</span>
      </div>
    </header>

    <div class="toolbar">
      <label style="font-size: 14px; font-weight: 600;">배점:
        <select id="scoreSelect">
          <option value="5">5점</option>
          <option value="10" selected>10점</option>
          <option value="20">20점</option>
          <option value="30">30점</option>
          <option value="50">50점</option>
        </select>
      </label>

      <button class="btn-primary" onclick="openBuzzer()">🔔 새 문제 (부저 열기)</button>
      <button class="btn-danger" onclick="lockBuzzer()">🛑 부저 잠금</button>

      <label style="margin-left: auto; font-size: 14px; font-weight: 600;">표시 인원:
        <select id="maxRankSelect" onchange="changeMaxDisplay(this.value)">
          <option value="3">상위 3명</option>
          <option value="5">상위 5명</option>
          <option value="10" selected>상위 10명</option>
          <option value="15">상위 15명</option>
          <option value="30">상위 30명</option>
        </select>
      </label>

      <button class="btn-light" onclick="resetAllScores()">🔄 점수 리셋</button>
      <button class="btn-danger" style="background: #e11d48;" onclick="startNewGame()">🚨 새 게임 시작</button>
    </div>

    <div class="grid">
      <!-- 선착순 큐 영역 -->
      <div class="card">
        <div class="card-title">
          <span>⚡ 누가 먼저 눌렀을까요? (<span id="queueLen">0</span>명 접수)</span>
        </div>

        <div id="firstBox" class="turn-box" style="display: none;">
          <div>
            <div style="font-size: 12px; font-weight: 700; color: #4338ca;">🏆 1순위 정답 기회</div>
            <div id="firstName" class="turn-name">-</div>
          </div>
          <div class="turn-actions">
            <button class="btn-primary" style="background: var(--success);" onclick="judge(true)">정답 (+배점)</button>
            <button class="btn-danger" onclick="judge(false)">오답 (다음 순위로)</button>
          </div>
        </div>

        <ul id="queueList" class="queue-list">
          <li style="color: #94a3b8; text-align: center; padding: 20px;">문제를 시작하면 선착순 명단이 여기에 표시됩니다.</li>
        </ul>
      </div>

      <!-- 점수 현황 영역 -->
      <div class="card">
        <div class="card-title">
          <span>🏆 점수 현황</span>
        </div>
        <ul id="scoreList" class="score-list"></ul>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentQueue = [];
    let currentScores = {};

    socket.emit('teacher_init');

    socket.on('state_update', (data) => {
      updateLockStatus(data.isLocked);
      currentQueue = data.buzzerQueue;
      currentScores = data.scores;
      document.getElementById('maxRankSelect').value = data.maxDisplayCount;
      document.getElementById('scoreSelect').value = data.currentQuestionScore;
      document.getElementById('onlineCount').innerText = data.onlineCount || 0;
      renderQueue();
      renderScores();
    });

    socket.on('buzzer_state_change', ({ isLocked }) => updateLockStatus(isLocked));
    socket.on('queue_updated', (queue) => {
      currentQueue = queue;
      renderQueue();
    });
    socket.on('scores_updated', (scores) => {
      currentScores = scores;
      renderScores();
    });
    socket.on('student_list_updated', ({ scores, onlineCount }) => {
      currentScores = scores;
      document.getElementById('onlineCount').innerText = onlineCount;
      renderScores();
    });

    function updateLockStatus(isLocked) {
      const badge = document.getElementById('lockBadge');
      if (isLocked) {
        badge.innerText = '부저 잠김';
        badge.className = 'status-pill pill-locked';
      } else {
        badge.innerText = '부저 열림 (신호 대기중)';
        badge.className = 'status-pill pill-open';
      }
    }

    function renderQueue() {
      document.getElementById('queueLen').innerText = currentQueue.length;
      const firstBox = document.getElementById('firstBox');
      const list = document.getElementById('queueList');

      if (currentQueue.length > 0) {
        firstBox.style.display = 'flex';
        document.getElementById('firstName').innerText = currentQueue[0].name;
      } else {
        firstBox.style.display = 'none';
      }

      list.innerHTML = '';
      if (currentQueue.length === 0) {
        list.innerHTML = '<li style="color: #94a3b8; text-align: center; padding: 20px;">문제를 시작하면 선착순 명단이 여기에 표시됩니다.</li>';
        return;
      }

      currentQueue.forEach((item, idx) => {
        const li = document.createElement('li');
        li.className = 'queue-item';
        li.innerHTML = `
          <div style="display:flex; align-items:center;">
            <span class="rank-num">${idx + 1}위</span>
            <strong style="font-size: 16px; color: ${idx === 0 ? 'var(--primary)' : '#1e293b'}">${item.name}</strong>
          </div>
          <span style="font-size: 12px; color: #94a3b8;">${idx === 0 ? '정답 확인 대기' : '대기중'}</span>
        `;
        list.appendChild(li);
      });
    }

    function renderScores() {
      const list = document.getElementById('scoreList');
      list.innerHTML = '';
      const sorted = Object.entries(currentScores).sort((a, b) => b[1] - a[1]);

      if (sorted.length === 0) {
        list.innerHTML = '<li style="color: #94a3b8; text-align: center; padding: 20px;">접속한 학생이 없습니다.</li>';
        return;
      }

      sorted.forEach(([name, score], idx) => {
        const li = document.createElement('li');
        li.className = 'score-item';
        li.innerHTML = `
          <div style="display:flex; align-items:center; gap: 8px;">
            <span style="font-size: 13px; font-weight: 700; color: #94a3b8; width: 20px;">${idx + 1}</span>
            <span class="student-name">${name}</span>
          </div>
          <div style="display:flex; align-items:center;">
            <span class="student-score">${score}점</span>
            <button class="btn-gear" onclick="toggleMenu('${name}', event)">⚙️</button>
            <div id="menu-${name}" class="action-menu">
              <button class="btn-light" onclick="adjustScore('${name}', 10)">+10점</button>
              <button class="btn-light" onclick="adjustScore('${name}', -5)">-5점</button>
              <button class="btn-danger" style="background:#fee2e2; color:#dc2626;" onclick="kickStudent('${name}')">퇴장</button>
            </div>
          </div>
        `;
        list.appendChild(li);
      });
    }

    function toggleMenu(name, event) {
      event.stopPropagation();
      document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
      const menu = document.getElementById(`menu-${name}`);
      if (menu) menu.classList.add('active');
    }

    document.addEventListener('click', () => {
      document.querySelectorAll('.action-menu').forEach(m => m.classList.remove('active'));
    });

    function openBuzzer() {
      const score = document.getElementById('scoreSelect').value;
      socket.emit('open_buzzer', score);
    }
    function lockBuzzer() { socket.emit('lock_buzzer'); }
    function changeMaxDisplay(val) { socket.emit('set_max_display', val); }
    function judge(isCorrect) {
      const score = document.getElementById('scoreSelect').value;
      socket.emit('judge_first_student', { isCorrect, score });
    }
    function adjustScore(name, delta) { socket.emit('manual_score_adjust', { name, delta }); }
    function kickStudent(name) {
      if (confirm(`'${name}' 학생을 정말 퇴장시키겠습니까?`)) socket.emit('kick_student', name);
    }
    function resetAllScores() {
      if (confirm('모든 학생의 점수를 0점으로 초기화하시겠습니까? (학생 화면 유지)')) socket.emit('reset_all_scores');
    }
    function startNewGame() {
      if (confirm('새 게임을 시작하시겠습니까?\n모든 학생이 퇴장 처리되며 초기 로그인 화면으로 돌아갑니다.')) socket.emit('start_new_game');
    }
  </script>
</body>
</html>
